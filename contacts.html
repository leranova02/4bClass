  <script>
    // Прокрутить меню к активному пункту
document.addEventListener('DOMContentLoaded', function () {
  const activeLink = document.querySelector('.nav a.active');
  if (activeLink) {
    activeLink.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });
  }
});
    /* ---------- КОНТАКТЫ ---------- */
    const grid = document.getElementById('contacts-grid');
    const data = window.contacts || {};

    function row(label, value) {
      if (!value) return '';
      return '<div class="contact-row">' +
               '<span class="contact-label">' + label + '</span>' +
               '<span class="contact-value">' + value + '</span>' +
             '</div>';
    }

    if (data.teacher) {
      const card = document.createElement('div');
      card.className = 'contact-card';
      card.innerHTML =
        '<h3>Классный руководитель</h3>' +
        row('Имя', data.teacher.name) +
        row('Роль', data.teacher.role) +
        row('Телефон', data.teacher.phone) +
        row('Email', data.teacher.email);
      grid.appendChild(card);
    }

    if (data.school) {
      const card = document.createElement('div');
      card.className = 'contact-card';
      card.innerHTML =
        '<h3>Школа</h3>' +
        row('Название', data.school.name) +
        row('Адрес', data.school.address) +
        row('Телефон', data.school.phone);
      grid.appendChild(card);
    }
  </script>
