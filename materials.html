  <script>
    // Прокрутить меню к активному пункту
document.addEventListener('DOMContentLoaded', function () {
  const activeLink = document.querySelector('.nav a.active');
  if (activeLink) {
    activeLink.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });
  }
});
    /* ---------- МАТЕРИАЛЫ ---------- */
    const container = document.getElementById('materials-container');
    const materials = window.materials || [];

    const GROUP_TITLES = {
      book:  'Книги и чтение',
      vpr:   'ВПР и проверочные работы',
      other: 'Другое'
    };

    const PDF_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                     '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>' +
                     '<path d="M14 3v6h6M8 13h1.5v4M8 13h2a1 1 0 0 1 0 2H8M13 13v4h1a2 2 0 0 0 0-4h-1z"/>' +
                     '</svg>';

    if (materials.length === 0) {
      document.getElementById('empty-state').hidden = false;
    } else {
      const groups = {};
      materials.forEach(function (m) {
        const tag = m.tag || 'other';
        if (!groups[tag]) groups[tag] = [];
        groups[tag].push(m);
      });

      const order = ['book', 'vpr', 'other'];

      order.forEach(function (tag) {
        if (!groups[tag] || groups[tag].length === 0) return;

        const groupEl = document.createElement('div');
        groupEl.className = 'materials-group';

        const title = document.createElement('h2');
        title.className = 'materials-group-title';
        title.textContent = GROUP_TITLES[tag] || tag;
        groupEl.appendChild(title);

        const list = document.createElement('div');
        list.className = 'materials-list';

        groups[tag].forEach(function (m) {
          const card = document.createElement('a');
          card.className = 'material-card';
          card.href = m.file;
          card.target = '_blank';
          card.rel = 'noopener';
          card.setAttribute('download', '');

          const badge = m.isNew
            ? '<span class="material-badge-new">Новое</span>'
            : '';

          card.innerHTML =
            '<span class="material-icon">' + PDF_ICON + '</span>' +
            '<div class="material-info">' +
              badge +
              '<h3>' + m.title + '</h3>' +
              '<p>' + (m.desc || '') + '</p>' +
            '</div>';
          list.appendChild(card);
        });

        groupEl.appendChild(list);
        container.appendChild(groupEl);
      });
    }
  </script>
