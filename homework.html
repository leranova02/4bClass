  <script>
    // Прокрутить меню к активному пункту
document.addEventListener('DOMContentLoaded', function () {
  const activeLink = document.querySelector('.nav a.active');
  if (activeLink) {
    activeLink.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });
  }
});
    const WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
    const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    function toKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function formatDate(d) {
      return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    }

    /* ---------- ДОМАШКА ---------- */
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const todayKey = toKey(today);

    const dates = Object.keys(window.homework || {}).sort(function (a, b) {
      return b.localeCompare(a);
    });

    const container = document.getElementById('homework-container');

    if (dates.length === 0) {
      document.getElementById('empty-state').hidden = false;
    } else {
      dates.forEach(function (dateKey) {
        const d = new Date(dateKey + 'T00:00:00');
        const items = window.homework[dateKey] || [];
        if (items.length === 0) return;

        const isToday = dateKey === todayKey;

        const block = document.createElement('article');
        block.className = 'homework-day';
        if (isToday) block.classList.add('homework-day--today');

        const head = document.createElement('div');
        head.className = 'homework-day-head';
        head.innerHTML =
          '<h3>' + formatDate(d) + '</h3>' +
          '<span class="hw-weekday">' + cap(WEEKDAYS[d.getDay()]) + '</span>';
        block.appendChild(head);

        const list = document.createElement('ul');
        list.className = 'hw-list';
        items.forEach(function (item) {
          const li = document.createElement('li');
          li.innerHTML = '<span class="hw-subject">' + item.subject + '</span>' +
                         '<span class="hw-task">' + item.task + '</span>';
          list.appendChild(li);
        });
        block.appendChild(list);

        container.appendChild(block);
      });
    }
  </script>
