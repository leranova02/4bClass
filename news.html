  <!-- МЕНЮ -->

        Домашка
      </a>
      <a href="news.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 8h3v9a2 2 0 0 1-2 2h-1M8 9h6M8 13h6"/></svg>

  <main>
    <div class="container">

      <section class="page-section">
        <div class="news-feed" id="news-feed"></div>
        <p class="empty-state" id="empty-state" hidden>Пока новостей нет — скоро появятся.</p>
      </section>

    </div>
  </main>

  <!-- ФУТЕР -->

    <div class="footer-inner">

      <a href="index.html" class="footer-brand">
        <img src="images/logo.png" alt="">

      <nav class="footer-links">

  <script src="js/data.js"></script>
  <script>
    // Прокрутить меню к активному пункту
document.addEventListener('DOMContentLoaded', function () {
  const activeLink = document.querySelector('.nav a.active');
  if (activeLink) {
    activeLink.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });
  }
});
    /* ---------- НОВОСТИ ---------- */
    const feed = document.getElementById('news-feed');
    const news = window.news || [];

    if (news.length === 0) {
      document.getElementById('empty-state').hidden = false;
    } else {
      news.forEach(function (n) {
        const el = document.createElement('article');
        el.className = 'news-feed-item';

        const photo = n.image
          ? '<img src="' + n.image + '" alt="" loading="lazy">'
          : '';

        const badge = n.event
          ? '<span class="news-event-badge">Скоро</span> '
          : '';

        el.innerHTML =
          photo +
          '<div class="news-feed-body">' +
            '<time>' + badge + n.date + '</time>' +
            '<h3>' + n.title + '</h3>' +
            '<p>' + n.text + '</p>' +
          '</div>';
        feed.appendChild(el);
      });
    }
  </script>
</body>
</html>
